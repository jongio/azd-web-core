allowBuilds:
  esbuild: true
  sharp: true
# Supply-chain cooldown: refuse dependency versions published within the last
# 7 days, so a compromised release has time to be caught and yanked before it
# can reach an install here. The `minimumReleaseAgeExclude` list below is the
# set of deliberate opt-outs; without this key that entire list was inert.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - astro@7.0.3 || 7.0.4 || 7.0.5 || 7.0.6 || 7.1.4
  - eslint-plugin-astro@2.1.1 || 3.1.0
  - smol-toml@1.6.1
  - picomatch@2.3.2
  - yaml@2.8.3
  - postcss@8.5.10
  - fast-uri@3.1.1 || 3.1.2
  - js-yaml@4.1.2
  - eslint@10.6.0 || 10.8.0
  - '@typescript-eslint/eslint-plugin@8.62.1'
  - '@typescript-eslint/parser@8.62.1'
  - '@typescript-eslint/project-service@8.62.1'
  - '@typescript-eslint/scope-manager@8.62.1'
  - '@typescript-eslint/tsconfig-utils@8.62.1'
  - '@typescript-eslint/type-utils@8.62.1'
  - '@typescript-eslint/types@8.62.1'
  - '@typescript-eslint/typescript-estree@8.62.1'
  - '@typescript-eslint/utils@8.62.1'
  - '@typescript-eslint/visitor-keys@8.62.1'
  - tailwindcss@4.3.2
  - typescript-eslint@8.62.1
  - '@astrojs/compiler-binding-darwin-arm64@0.3.0'
  - '@astrojs/compiler-binding-darwin-x64@0.3.0'
  - '@astrojs/compiler-binding-linux-arm64-gnu@0.3.0'
  - '@astrojs/compiler-binding-linux-arm64-musl@0.3.0'
  - '@astrojs/compiler-binding-linux-x64-gnu@0.3.0'
  - '@astrojs/compiler-binding-linux-x64-musl@0.3.0'
  - '@astrojs/compiler-binding-wasm32-wasi@0.3.0'
  - '@astrojs/compiler-binding-win32-arm64-msvc@0.3.0'
  - '@astrojs/compiler-binding-win32-x64-msvc@0.3.0'
  - '@astrojs/compiler-binding@0.3.0'
  - '@astrojs/compiler-rs@0.3.0'
  - '@astrojs/internal-helpers@0.10.1'
  - '@astrojs/markdown-satteri@0.3.3'
  - '@astrojs/check@0.9.10'
  # Added alongside the jsdom-based test suite. Dev-only, never shipped in the
  # published tarball, and reviewed at the versions pinned in the lockfile.
  - '@asamuzakjp/dom-selector@8.3.2'
  - '@types/node@26.1.2'
  - jsdom@30.0.1
  - tldts@7.4.10
  - tldts-core@7.4.10
overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  fast-uri@<=3.1.3: ^3.1.4
  js-yaml@<=4.1.1: ^4.1.2
  picomatch@<2.3.2: ^2.3.2
  postcss@<=8.5.17: ^8.5.18
  smol-toml@<1.6.1: ^1.6.1
  svgo@>=4.0.0 <4.0.2: ^4.0.2
  yaml@>=2.0.0 <2.8.3: ^2.8.3
