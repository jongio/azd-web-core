name: Notify Consumer Sites

on:
  workflow_run:
    workflows: ["Publish Packages"]
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Active consumers only. Archived repositories reject repository_dispatch
        # with 403, which fails the job without any way to recover. jongio/azd-exec
        # and jongio/azd-copilot were archived and removed from this matrix for
        # that reason.
        repo:
          - jongio/azd-app
          - jongio/azd-rest
          - jongio/azd-extensions
    steps:
      - name: Dispatch rebuild to ${{ matrix.repo }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.CONSUMER_DISPATCH_PAT }}
          repository: ${{ matrix.repo }}
          event-type: azd-web-core-updated
          # `toJSON` on the raw ref quotes and escapes it. Building the JSON with
          # `format()` instead would splice the ref in unescaped, and git allows
          # `"` in ref names, so a crafted tag could inject arbitrary keys into
          # the payload or break parsing and fail the dispatch for every consumer.
          client-payload: '{"version": ${{ toJSON(github.event.workflow_run.head_branch) }} }'
